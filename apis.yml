name: Sequence Markets
description: >-
  Sequence Markets is a Y Combinator (Winter 2026) trading operating system for
  institutional crypto that provides unified execution infrastructure across 12
  fragmented digital-asset venues — centralized exchanges (Coinbase, Binance,
  Kraken, OKX, Bybit, Bitget, Crypto.com, Hyperliquid), DeFi, and prediction
  markets (Kalshi, Polymarket). It packages one market view into a single trade
  via a smart order router (SOR), execution graphs, and WASM-compiled algo
  strategies deployed to multi-region low-latency edges. Developers access it
  through a Bearer-auth REST API and multiplexed WebSocket streams, a Python SDK,
  a Rust SDK, an Algo SDK, a `sequence` CLI, and an MCP interface for human,
  algorithmic, and agent workflows, with a full paper-trading sandbox, smart
  order routing, and transaction-cost analytics (TCA).
